name: Smoke tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  endpoint-b-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      # Match the existing cached Chromium 1187 acceptance baseline.
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Desktop and mobile Endpoint B acceptance / 桌面手机交互验收
        run: node tests/test_endpoint_b_browser.js
        env:
          ENDPOINT_B_ARTIFACTS_DIR: /tmp/endpoint-b-browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endpoint-b-desktop-mobile
          path: |
            /tmp/endpoint-b-browser-artifacts/*.png
            /tmp/endpoint-b-browser-artifacts/acceptance.json
            /tmp/endpoint-b-browser-artifacts/failure.json
          if-no-files-found: warn
  windows-frequency:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 synthetic frequency tests
        shell: powershell
        run: ./tests/test_windows_frequency.ps1
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      # Temporary SQLite + blocked HTTP; no secrets / 临时数据库且禁用网络，不需要密钥。
      - run: python3 -B -m unittest discover -s tests -v
      - run: node tests/test_lite.js
      - run: node tests/test_network.js
      - run: node tests/test_network_readability.js
      - run: node tests/test_device_v3.js
      - run: node tests/test_freshness.js
      - run: node tests/test_offline_seen.js
      - run: node tests/test_performance_history.js
      - name: Python syntax / Python 语法
        run: python3 -B -c "import ast, pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('.').rglob('*.py') if '.venv' not in p.parts]"
      - name: JavaScript syntax / JavaScript 语法
        run: |
          node --check static/dashboard.js
          node --check static/lite.js
          node --check static/offline-seen.js
          node --check static/performance-history.js
          node --check static/endpoint-b.js
          node --check tests/test_network.js
